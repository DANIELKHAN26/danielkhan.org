# Keeps dependencies and GitHub Actions up to date with monthly, grouped pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      all-npm: { patterns: ['*'] }
    ignore:
      # @astrojs/check 0.9.x requires TypeScript 6 (Oct 2026). Remove this once it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      all-actions: { patterns: ['*'] }
