name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: '4.151.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check and validate content
        run: npm run check
      - name: Build site and search index
        run: npm run build
      - name: Verify links, metadata and drafts
        run: node scripts/verify-dist.mjs
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7

  # Publishes to Cloudflare only after every check above has passed.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://danielkhan.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy site
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy
      - name: Deploy www → apex redirect
        working-directory: workers/www-redirect
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy
