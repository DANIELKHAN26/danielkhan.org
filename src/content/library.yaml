# Outside work credited in the Lab library. Facts verified 23 Oct 2026 against each project's own pages.
# topic: "Verification & news data" | "Speech & video" | "Bengali NLP"
# Keep `licence` accurate — several research resources are for non-commercial use only.

- id: media-cloud
  title: Media Cloud
  url: https://www.mediacloud.org/
  by: Media Ecosystems Analysis Group, UMass Amherst and Northeastern University
  topic: Verification & news data
  licence: Open source (Apache-2.0); data under its terms of use
  note: Open-source platform for searching and comparing online news coverage across outlets and countries.

- id: gdelt
  title: The GDELT Project
  url: https://www.gdeltproject.org/
  by: Kalev H. Leetaru
  topic: Verification & news data
  licence: Free for any use, with citation and a link back
  note: Open database of world news events since 1979, updated every 15 minutes — for discovering reporting, not proving a claim.

- id: google-fact-check-tools
  title: Google Fact Check Tools API
  url: https://developers.google.com/fact-check/tools/api
  by: Google
  topic: Verification & news data
  licence: Google APIs Terms of Service (free API key)
  note: Searches published fact-checks (ClaimReview) from fact-checking organisations worldwide.

- id: fever
  title: "FEVER: a Large-scale Dataset for Fact Extraction and VERification"
  url: https://aclanthology.org/N18-1074/
  by: Thorne, Vlachos, Christodoulopoulos and Mittal — NAACL 2018
  topic: Verification & news data
  licence: Wikipedia licence terms (CC BY-SA 3.0); code Apache-2.0
  note: 185,445 claims checked against Wikipedia — a widely used benchmark for automated claim verification.

- id: averitec
  title: "AVeriTeC: A Dataset for Real-world Claim Verification with Evidence from the Web"
  url: https://arxiv.org/abs/2305.13117
  by: Schlichtkrull, Guo and Vlachos — NeurIPS 2023
  topic: Verification & news data
  licence: CC BY-NC 4.0
  note: 4,568 real-world claims from 50 fact-checking organisations, with evidence gathered from the web.

- id: whisper
  title: Whisper
  url: https://github.com/openai/whisper
  by: OpenAI
  topic: Speech & video
  licence: MIT (code and model weights)
  note: Open speech-recognition model for transcribing and translating audio — a starting point for news-video transcripts.

- id: banglabert
  title: "BanglaBERT: Language Model Pretraining and Benchmarks for Low-Resource Language Understanding Evaluation in Bangla"
  url: https://aclanthology.org/2022.findings-naacl.98/
  by: Bhattacharjee et al., CSE BUET NLP — Findings of NAACL 2022
  topic: Bengali NLP
  licence: CC BY-NC-SA 4.0
  note: Bangla language-understanding model and benchmark suite; code and weights at github.com/csebuetnlp/banglabert.

- id: banglat5
  title: "BanglaNLG and BanglaT5: Benchmarks and Resources for Evaluating Low-Resource Natural Language Generation in Bangla"
  url: https://aclanthology.org/2023.findings-eacl.54/
  by: Bhattacharjee, Hasan, Ahmad and Shahriyar — Findings of EACL 2023
  topic: Bengali NLP
  licence: CC BY-NC-SA 4.0
  note: Bangla text-generation model and benchmarks — useful for summarising and explaining claims in Bangla.
